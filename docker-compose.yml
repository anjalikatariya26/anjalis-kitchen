version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: anjalis-kitchen-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: anjali
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: anjalis_kitchen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anjali -d anjalis_kitchen']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
