# High-Performance Nginx Site Configuration for Anjali's Kitchen
# Handles 1000+ concurrent users with zero lag on AWS Free Tier

server {
    listen 80;
    server_name 3.27.1.14.sslip.io 3.27.1.14 _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 3.27.1.14.sslip.io 3.27.1.14 _;

    ssl_certificate /etc/letsencrypt/live/3.27.1.14.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.27.1.14.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        font/woff2
        font/woff
        image/svg+xml;

    # Buffer tuning to avoid disk buffering
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;

    # Direct static files: Next.js immutable bundles
    location /_next/static/ {
        alias /home/ec2-user/anjalis-kitchen/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Direct static files: Uploaded images
    location /media/ {
        alias /home/ec2-user/anjalis-kitchen/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Direct static assets: Public folder images, favicons, logos
    location ~* \.(ico|jpg|jpeg|png|webp|avif|svg|gif|woff2|woff|ttf|css|js)$ {
        root /home/ec2-user/anjalis-kitchen/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @proxy;
    }

    # Dynamic & SSR requests with microcaching
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Microcaching for high-concurrency read throughput
        proxy_cache AK_CACHE;
        proxy_cache_valid 200 302 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $not_get $is_admin_path $has_admin_session $has_server_action;
        proxy_no_cache $not_get $is_admin_path $has_admin_session $has_server_action;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Named fallback location for static file misses
    location @proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
