# Nginx Cache and Concurrency Tuning for Anjali's Kitchen

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=AK_CACHE:20m max_size=1g inactive=60m use_temp_path=off;
proxy_cache_key "$scheme$request_method$host$request_uri";

# Cache bypass conditions using high-efficiency hash maps
map $request_method $not_get {
    default 1;
    GET     0;
    HEAD    0;
}

map $request_uri $is_admin_path {
    default 0;
    ~*^/admin 1;
    ~*^/api/admin 1;
}

map $http_cookie $has_admin_session {
    default 0;
    ~*ak_session 1;
}

map $http_next_action $has_server_action {
    default 1;
    ""      0;
}
